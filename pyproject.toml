[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-enrichment-api"
version = "1.0.0"
description = "Webhook-driven AI lead enrichment pipeline for financial services"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "anthropic>=0.84.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
    "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lead_enrichment"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true
